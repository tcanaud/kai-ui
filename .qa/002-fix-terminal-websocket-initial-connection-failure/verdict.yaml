bugs_found: []

bugs_fixed:
  - id: BUG-001
    title: "Infinite reconnection loop when server accepts then immediately closes WebSocket"
    original_cause: |
      The onopen handler unconditionally reset reconnectAttemptsRef.current to 0.
      When the server accepted then immediately closed (e.g., PTY spawn failure),
      the counter was reset on every attempt, preventing MAX_RECONNECT_ATTEMPTS from being reached.
    fix_applied: |
      Replaced the unconditional counter reset in onopen with a 2-second stability timer.
      The counter is only reset after the connection has been open for 2 seconds (proving
      it is truly alive). If onclose fires before the timer, it is cleared and the counter
      is NOT reset. The previous fix (moving reset to onmessage) was insufficient because
      the server sends an error message before closing, so onmessage still fired.
    file: "src/app/lib/use-terminal.ts"
    verification: "6 total WebSocket attempts observed (1 initial + 5 retries), error state reached correctly."

