name: "hotfix"
description: "Fast-track critical bugs — pick critical backlogs, implement the fix, run QA, and ship a PR without full spec cycle"
version: "1.0"

args:
  - name: "backlog"
    description: "Critical backlog ID to hotfix (e.g., BL-003). If omitted, auto-selects the highest-priority critical-bug backlog."
    required: false

steps:
  - id: "select-critical"
    command: "/product.backlog"
    args: "{{backlog}} — If a backlog ID is provided, inspect it and confirm it is a critical-bug. If no ID is provided, list all open backlogs filtered to critical-bug category with critical or high priority, and select the most urgent one. Report the selected backlog ID, title, and linked feedbacks."
    autonomy: "auto"
    preconditions: []
    postconditions: []
    error_policy: "stop"
    escalation_triggers: []

  - id: "promote-to-feature"
    command: "/product.promote"
    args: "Promote the selected critical backlog to a feature. This creates the feature YAML and updates traceability links."
    autonomy: "auto"
    preconditions: []
    postconditions: []
    error_policy: "stop"
    escalation_triggers:
      - "subagent_error"

  - id: "agreement-create"
    command: "/agreement.create"
    args: "Create a lightweight agreement for the hotfix feature — focus on the fix scope and acceptance criteria only, skip detailed architecture."
    autonomy: "auto"
    preconditions: []
    postconditions:
      - "agreement_exists"
    error_policy: "gate"
    escalation_triggers:
      - "subagent_error"

  - id: "qa-plan"
    command: "/qa.plan"
    args: "Generate a focused test plan for the hotfix — regression test for the bug, smoke test for surrounding functionality. Keep it minimal and targeted."
    autonomy: "auto"
    preconditions: []
    postconditions:
      - "qa_plan_exists"
    error_policy: "stop"
    escalation_triggers: []

  - id: "qa-run"
    command: "/qa.run"
    args: "Execute the hotfix test plan. Verify the bug is fixed and no regressions introduced."
    autonomy: "auto"
    preconditions:
      - "qa_plan_exists"
    postconditions:
      - "qa_verdict_pass"
    error_policy: "gate"
    escalation_triggers:
      - "verdict_fail"

  - id: "pr"
    command: "/feature.pr"
    args: "Create a PR for the hotfix. Tag as critical-bug fix. Include the backlog ID and linked feedback IDs in the PR description for traceability."
    autonomy: "gate_always"
    preconditions:
      - "qa_verdict_pass"
    postconditions:
      - "pr_created"
    error_policy: "stop"
    escalation_triggers: []
