name: "autohotfix"
description: "Full-auto hotfix — auto-selects the most urgent critical bug, promotes it, diagnoses, fixes, verifies, and ships. Zero manual input required."
version: "2.0"

args: []

steps:
  - id: "select-critical"
    command: "/product.backlog"
    args: "List all open backlogs filtered to critical-bug category with critical or high priority. Select the most urgent one. Report the selected backlog ID, title, and linked feedbacks."
    model: "haiku"
    autonomy: "auto"
    preconditions: []
    postconditions: []
    error_policy: "stop"
    escalation_triggers: []

  - id: "promote-to-feature"
    command: "/product.promote"
    args: "Find the most recent critical-bug backlog (check .product/backlogs/ for the highest-priority critical-bug with status open). Promote it to a feature. This creates the feature YAML and updates traceability links."
    model: "sonnet"
    autonomy: "auto"
    preconditions: []
    postconditions: []
    error_policy: "stop"
    escalation_triggers:
      - "subagent_error"

  - id: "diagnose-fix-verify"
    command: "/speckit.implement"
    args: "HOTFIX MODE — Do NOT read tasks.md. Instead, follow this protocol:\n\n## 0. Discover\nRead .features/ to find the most recently created feature. Read its YAML to understand the issue.\n\n## 1. Explore (max 5 min)\nInvestigate the issue described in the feature YAML.\n- Read error logs, relevant source files, and config\n- Reproduce the bug if possible (run the app, curl endpoints, check browser)\n- Identify root cause with evidence\n\n## 2. Fix\n- Apply the minimal, targeted fix\n- Touch only what's broken — no refactoring, no cleanup\n- If multiple files need changes, change them all\n\n## 3. Verify\n- Confirm the fix works (run the app, execute the failing scenario, check output)\n- Run lint/tests if they exist: npm test && npm run lint\n- Report: root cause, what changed, verification result\n\nIf the fix doesn't work on first attempt, iterate (max 3 attempts) before escalating."
    model: "opus"
    autonomy: "auto"
    preconditions: []
    postconditions: []
    error_policy: "gate"
    escalation_triggers:
      - "subagent_error"

  - id: "qa-plan"
    command: "/qa.plan"
    args: "Find the most recently created feature in .features/. Generate a focused test plan for its hotfix — regression test for the bug, smoke test for surrounding functionality. Keep it minimal and targeted."
    model: "sonnet"
    autonomy: "auto"
    preconditions: []
    postconditions:
      - "qa_plan_exists"
    error_policy: "stop"
    escalation_triggers: []

  - id: "qa-run"
    command: "/qa.run"
    args: "Find the most recently created feature in .features/. Execute its test plan. Verify the bug is fixed and no regressions introduced."
    model: "opus"
    autonomy: "auto"
    preconditions:
      - "qa_plan_exists"
    postconditions:
      - "qa_verdict_pass"
    error_policy: "gate"
    escalation_triggers:
      - "verdict_fail"

  - id: "resolve"
    command: "/feature.resolve"
    args: "Find the most recently created feature in .features/. Mark it and its linked feedbacks as done. Close the lifecycle."
    model: "sonnet"
    autonomy: "auto"
    preconditions:
      - "qa_verdict_pass"
    postconditions: []
    error_policy: "gate"
    escalation_triggers:
      - "subagent_error"

  - id: "pr"
    command: "/feature.pr"
    args: "Find the most recently created feature in .features/. Create a hotfix PR for it."
    model: "sonnet"
    autonomy: "gate_always"
    preconditions: []
    postconditions:
      - "pr_created"
    error_policy: "stop"
    escalation_triggers: []
